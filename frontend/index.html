<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Login — Register & Checkout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="logo">🛒 OTP Shop</span>
      <nav>
        <a href="index.html" class="nav-link active">Checkout</a>
        <a href="register.html" class="nav-link">Register</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Welcome banner (shown after login) -->
    <div id="welcomeBanner" class="welcome-banner hidden"></div>

    <div class="card">
      <h1>Checkout</h1>
      <p class="subtitle">Fill in your details to complete your order.</p>

      <form id="checkoutForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-error" id="emailError"></span>
          <span class="field-hint" id="recognizeStatus"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" autocomplete="tel" />
          <span class="field-error" id="phoneError"></span>
        </div>

        <div class="form-group">
          <label for="shippingAddress">Shipping Address *</label>
          <textarea id="shippingAddress" name="shippingAddress" rows="3" placeholder="123 Main St, City, State, ZIP"></textarea>
          <span class="field-error" id="addressError"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span class="btn-text">Place Order</span>
          <span class="spinner hidden"></span>
        </button>
      </form>

      <div id="successMsg" class="success-msg hidden"></div>
    </div>
  </main>

  <!-- OTP Modal -->
  <div id="otpModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Account Found!</h2>
      <p id="modalDesc">We found a registered account for <strong id="modalEmail"></strong>. Enter your 6-digit code to log in.</p>

      <div class="form-group">
        <label for="otpInput">6-Digit Code</label>
        <input type="text" id="otpInput" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="000000" autocomplete="one-time-code" />
        <span class="field-error" id="otpError"></span>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="verifyBtn">
          <span class="btn-text">Verify & Login</span>
          <span class="spinner hidden"></span>
        </button>
        <button class="btn btn-ghost" id="skipBtn">Continue as Guest</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">© 2026 OTP Shop · Built with ❤️</footer>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
